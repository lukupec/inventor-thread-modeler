name: build

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']   # tags are handled by release.yml
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build, test, package (add-in + MSI)
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      # GitHub always delivers artifacts as a .zip - unzip once to get the file/folder.
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ThreadModeler-installer
          path: |
            dist/*.msi
            dist/*.msi.sha256
          if-no-files-found: error

      - name: Upload bundle folder
        uses: actions/upload-artifact@v4
        with:
          name: cODTthreadModeler.bundle
          path: dist/cODTthreadModeler.bundle/
          if-no-files-found: error
